name: Scanner tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Vulnerable corpus
        run: python -m scanner.cli.main scan tests/vulnerable --fail-on never --format json --quiet
      - name: False-positive corpus
        run: python -m scanner.cli.main scan tests/false-positive --fail-on medium --quiet
      - name: Pytest scanner suite
        run: python -m pytest tests/test_scanner.py tests/regression
