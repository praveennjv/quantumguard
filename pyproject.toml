[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumguard"
version = "0.1.0"
description = "Developer-first cryptographic discovery, CBOM, and quantum-security risk platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "QuantumGuard" }]
keywords = ["cryptography", "cbom", "pqc", "quantum", "security", "sast"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "javalang>=0.13.0",
  "esprima>=4.0.1",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.16.4",
]
api = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
quantumguard = "scanner.cli.main:main"

[project.urls]
Homepage = "https://github.com/quantumguard/quantumguard"
Documentation = "https://github.com/quantumguard/quantumguard/tree/main/docs"
Issues = "https://github.com/quantumguard/quantumguard/issues"

[tool.setuptools.packages.find]
include = ["scanner*", "knowledge_base*"]

[tool.setuptools.package-data]
scanner = ["knowledge/*.yml", "reporting/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scanner", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scanner/detectors/*/__init__.py" = ["F401"]
"scanner/languages/*/__init__.py" = ["F401"]
